apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpath-backend
  template:
    metadata:
      labels:
        app: devpath-backend
    spec:
      containers:
        - name: backend
          image: devpath-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: devpath-backend
spec:
  type: NodePort
  selector:
    app: devpath-backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
