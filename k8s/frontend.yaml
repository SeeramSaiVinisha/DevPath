apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpath-frontend
  template:
    metadata:
      labels:
        app: devpath-frontend
    spec:
      containers:
        - name: frontend
          image: devpath-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: devpath-frontend
spec:
  type: NodePort
  selector:
    app: devpath-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000
