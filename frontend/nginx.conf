server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
    }

    location /quiz-api/ {
        proxy_pass http://quiz:5000/;
        proxy_set_header Host $host;
    }

    location /quiz-health {
        proxy_pass http://quiz:5000/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
