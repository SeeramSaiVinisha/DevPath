services:
  backend:
    build: ./backend
    image: devpath-backend:1.0
    ports:
      - "8081:8080"
    restart: unless-stopped

  quiz:
    build: ./quiz-service
    image: devpath-quiz:1.0
    ports:
      - "5001:5000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: devpath-frontend:1.0
    ports:
      - "3000:80"
    depends_on:
      - backend
      - quiz
    restart: unless-stopped
